# Fontes do boletim diário sobre o Claude.
# Campos:
#   nome      -> nome curto mostrado no boletim
#   url       -> endereço do feed RSS/Atom
#   categoria -> pista para o resumo (oficial | lancamentos | mcp | comunidade | tutoriais | imprensa)
#   filtrar   -> true = só aceita itens que mencionem as palavras-chave abaixo
#                (usar em fontes genéricas: imprensa, HN, dev.to)
# Fontes que falhem são ignoradas sem parar o boletim.

palavras_chave:
  - claude
  - anthropic
  - mcp
  - model context protocol
  - claude code
  - agent sdk
  - skills
  - sonnet
  - opus
  - haiku

palavras_publicidade:
  - sponsored
  - patrocinado
  - promo code
  - código promocional
  - discount
  - desconto
  - affiliate
  - giveaway
  - "% off"
  - black friday
  - webinar registration

